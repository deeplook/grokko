[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grokko"
version = "0.1.0"
description = "CLI to access Grok"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dinu Gherman", email = "gherman@darwin.in-berlin.de" }]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "browser-cookie3>=0.20.0",
    "playwright>=1.58.0",
    "playwright-stealth>=1.0.6",
    "python-dotenv>=1.2.2",
    "typer>=0.15.0",
]

[project.scripts]
grokko = "grokko:main"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/grokko"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "browser_cookie3"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/grokko"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "coverage>=7.11.0",
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
